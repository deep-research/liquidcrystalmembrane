name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build via Docker Compose
        run: |
          docker compose run --rm app yarn install
          docker compose run --rm app yarn build

      - name: Copy build files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/prototype-liquidcrystalmembrane/"

      - name: Flatten directory structure on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cp -a /var/www/prototype-liquidcrystalmembrane/dist/. /var/www/prototype-liquidcrystalmembrane/
            rm -rf /var/www/prototype-liquidcrystalmembrane/dist
